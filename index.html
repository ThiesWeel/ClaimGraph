<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClaimGraph</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #f0f2f5;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      background: #1c1c1e;
      color: #fff;
      flex-shrink: 0;
    }
    #header h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.2px; }
    #header .sp { flex: 1; }

    /* Buttons */
    button {
      cursor: pointer; border: none; border-radius: 5px;
      padding: 5px 11px; font-size: 12px; font-family: inherit;
    }
    button:hover { opacity: 0.82; }
    .bp { background: #3b82f6; color: #fff; }
    .bs { background: #555;    color: #fff; }
    .bd { background: #ef4444; color: #fff; }
    .sm { padding: 3px 8px; font-size: 11px; }

    /* Three-column layout */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* Side panels */
    .panel {
      width: 228px; flex-shrink: 0;
      display: flex; flex-direction: column;
      background: #fff; overflow: hidden;
    }
    #np { border-right: 1px solid #ddd; }
    #ep { border-left:  1px solid #ddd; }

    .ph {
      padding: 7px 12px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: #999; background: #fafafa;
      border-bottom: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pl { flex: 1; overflow-y: auto; }
    .pf { padding: 9px; border-top: 1px solid #eee; background: #fafafa; }

    /* List items */
    .item {
      padding: 7px 10px; border-bottom: 1px solid #f3f3f3;
      cursor: pointer; transition: background 0.08s;
    }
    .item:hover { background: #f7f7f7; }
    .item.on { background: #eff6ff; border-left: 3px solid #3b82f6; padding-left: 7px; }
    .it { font-size: 12px; font-weight: 500; line-height: 1.3; }
    .im { margin-top: 3px; font-size: 11px; color: #aaa; }
    .warn { color: #ef4444; font-size: 10px; }

    /* Badges */
    .b {
      display: inline-block; padding: 1px 6px; border-radius: 99px;
      font-size: 10px; font-weight: 700; color: #fff; vertical-align: middle;
    }

    /* Canvas */
    #cw {
      flex: 1; position: relative; overflow: hidden;
      background: #f8faff;
      background-image: radial-gradient(#dde3f0 1px, transparent 1px);
      background-size: 22px 22px;
    }
    #cv { width: 100%; height: 100%; display: block; }

    /* Edit panel */
    #editp {
      background: #fff; border-top: 2px solid #3b82f6;
      padding: 11px 16px 9px; flex-shrink: 0;
      display: none; max-height: 220px; overflow-y: auto;
    }
    #editp.open { display: block; }
    #editp h3 {
      font-size: 12px; font-weight: 700; margin-bottom: 9px;
      display: flex; align-items: center; gap: 6px;
    }

    /* Form rows */
    .fr { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 5px; }
    .fr label { font-size: 11px; color: #777; width: 72px; flex-shrink: 0; padding-top: 5px; }
    .fr input, .fr select, .fr textarea {
      flex: 1; border: 1px solid #ddd; border-radius: 4px;
      padding: 4px 7px; font-size: 12px; font-family: inherit; background: #fff;
    }
    .fr textarea { resize: vertical; min-height: 46px; }
    .fr input:focus, .fr select:focus, .fr textarea:focus {
      outline: none; border-color: #3b82f6;
    }
    .fa { display: flex; gap: 6px; margin-top: 7px; }

    /* Panel form: vertical layout */
    .pf .fr { flex-direction: column; gap: 2px; }
    .pf .fr label { width: auto; padding-top: 0; }
    .pf .fr input, .pf .fr select { width: 100%; }
  </style>
</head>
<body>

<div id="header">
  <h1>⬡ ClaimGraph</h1>
  <select id="graphSel" onchange="switchGraph(this.value)" style="margin-left:6px"></select>
  <button class="bs sm" onclick="newGraph()">+ Graph</button>
  <span id="foldbar" style="display:none;align-items:center;gap:6px;margin-left:14px">
    <span id="foldcount" style="font-size:11px;color:#bbb"></span>
    <button class="bs sm" onclick="foldSelected()">Fold into node</button>
    <button class="bs sm" onclick="extractSelected()">Extract to new graph</button>
    <button class="bs sm" onclick="consolidateViaAgent()">Consolidate via agent</button>
    <button class="bs sm" onclick="clearMultiSel()">Clear selection</button>
  </span>
  <span class="sp"></span>
  <button class="bs" onclick="clearAll()">Clear</button>
  <button class="bs" onclick="runValidation(false)">Validate</button>
  <button class="bs" onclick="trigImport()">Import JSON</button>
  <button class="bp" onclick="exportJSON()">Export JSON</button>
</div>

<div id="main">

  <!-- Nodes panel -->
  <div class="panel" id="np">
    <div class="ph"><span>Nodes</span><span id="nc" style="color:#ccc">0</span></div>
    <div class="pl" id="nl"></div>
    <div class="pf">
      <div class="fr"><label>Title</label><input id="nn-t" placeholder="New claim..."/></div>
      <div class="fr"><label>Type</label>
        <select id="nn-ty"></select>
      </div>
      <button class="bp" style="width:100%;margin-top:5px" onclick="addNode()">+ Add Node</button>
    </div>
  </div>

  <!-- Canvas -->
  <div id="cw">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ah-depends_on"      viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
        <marker id="ah-supports"        viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
        <marker id="ah-weakens"         viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
        <marker id="ah-refutes"         viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
        <marker id="ah-tests"           viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#06b6d4"/></marker>
        <marker id="ah-controls_for"    viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
        <marker id="ah-alternative_to"  viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
        <marker id="ah-fails_under"     viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
        <marker id="ah-motivates"       viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker>
        <marker id="ah-operationalizes" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14b8a6"/></marker>
        <marker id="ah-default"         viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
      </defs>
      <g id="ge"></g>
      <g id="gn"></g>
    </svg>
  </div>

  <!-- Edges panel -->
  <div class="panel" id="ep">
    <div class="ph"><span>Edges</span><span id="ec" style="color:#ccc">0</span></div>
    <div class="pl" id="el"></div>
    <div class="pf">
      <div class="fr"><label>From</label><select id="ne-f"></select></div>
      <div class="fr"><label>To</label><select id="ne-t"></select></div>
      <div class="fr"><label>Type</label>
        <select id="ne-ty"></select>
      </div>
      <div class="fr"><label>Rationale</label><input id="ne-r" placeholder="Why this edge..."/></div>
      <button class="bp" style="width:100%;margin-top:5px" onclick="addEdge()">+ Add Edge</button>
    </div>
  </div>

</div>

<!-- Edit panel -->
<div id="editp">
  <div id="editi"></div>
</div>

<input type="file" id="fi" accept=".json" style="display:none" onchange="onImport(event)">

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────────────────────

const NODE_TYPES = [
  'claim','hypothesis','question','assumption','evidence','test',
  'counterfactual','failure_mode','model_choice','metric','dataset_scope','decision'
];
const EDGE_TYPES = [
  'depends_on','supports','weakens','refutes','tests','controls_for',
  'alternative_to','fails_under','motivates','operationalizes'
];

const NCLR = {
  claim:'#3b82f6', hypothesis:'#06b6d4', question:'#ec4899', assumption:'#a855f7',
  evidence:'#22c55e', test:'#14b8a6', counterfactual:'#f59e0b', failure_mode:'#ef4444',
  model_choice:'#6366f1', metric:'#84cc16', dataset_scope:'#64748b', decision:'#f97316'
};
const ECLR = {
  depends_on:'#3b82f6', supports:'#22c55e', weakens:'#f59e0b', refutes:'#ef4444',
  tests:'#06b6d4', controls_for:'#8b5cf6', alternative_to:'#64748b', fails_under:'#b91c1c',
  motivates:'#ec4899', operationalizes:'#14b8a6'
};

const NW = 144, NH = 42; // node box dimensions

// Document read levels: how an AI agent traversing the graph should treat an attached document.
const DOC_LEVELS = {
  admin:   'admin (no read — administrative record only)',
  summary: 'summary (read summaries/ file when following this node)',
  full:    'full (read references/ file when following this node)'
};

// Node status: what still needs attention vs. what's settled.
const STATUS = ['open','active','settled','rejected','needs_test'];
const SCLR = {
  open:'#94a3b8', active:'#3b82f6', settled:'#22c55e', rejected:'#ef4444', needs_test:'#f59e0b'
};

const DEFAULT = {
  nodes: [
    { id:"C001", title:"Regime purity boosts OU predictive performance.", type:"claim", status:"open",
      body:"If degenerate observations contaminate the OU regime, emission parameters become biased, reducing forecast quality for non degenerate forecasts. Splitting the non degenerate observations and the degenerate observations, allows for better forecast quality.", documents:[] },
    { id:"C002", title:"What does degeneracy in spread series look like?", type:"question", status:"open",
      body:"If we want a theoretical proof of concept of with decontaminated OU model(s), we need to first probe somehow what degeneracy looks like: how does it occur? How long does it persist? what kind of models do work in these episodes? and with what parameters, RW + student-t?", documents:[] },
    { id:"C003", title:"Level ambiguity in regime-switching modelling approach", type:"question", status:"open",
      body:"Regime-specific means confound level heterogeneity with dynamic heterogeneity. They do not only capture how the spread behaves, such as fast reversion, slow reversion, or trending. They also capture the absolute level where the spread happened to sit during estimation.", documents:[] },
    { id:"C004", title:"MasterThesis goal", type:"claim", status:"open",
      body:"The core of the research: we want to model spread of cointegration relationships in a way that uses ML in an interpretable manner to boost already existing methods to be better.",
      documents:[{ level:"full", reference:"references/research_proposal.md", summary:"" }] },
    { id:"C005", title:"How do we model the hedge ratio relation?", type:"question", status:"open",
      body:"Moving parameters? or not? when do we deem a cointegration relationship to be not valid enough any more?", documents:[] },
    { id:"C006", title:"u_t ~ I(0), when stationarity 'enough'?", type:"question", status:"open",
      body:"", documents:[] },
    { id:"C007", title:"Symbolic regression as distillation method?", type:"question", status:"open",
      body:"this could be a good distil method", documents:[] },
    { id:"C008", title:"Avellanda2008 Residual modelling, good candidate for gated learning", type:"evidence", status:"open",
      body:"", documents:[] },
    { id:"C009", title:"Do static factor loadings contaminate the OU residuals?", type:"question", status:"open",
      body:"In the Avellaneda-Lee architecture, factor loadings beta_i are estimated statically (OLS on a fixed window). If the true loadings are time-varying (beta_{i,t}), the observable residual r_{i,t} - beta_i' F_t contains the contamination term (beta_{i,t} - beta_i)' F_t, which is driven by common factors and is not idiosyncratic. Does this contamination bias the OU parameter estimates (kappa, m, sigma)? Can it create spurious apparent mean-reversion or destroy true mean-reversion?", documents:[] },
    { id:"C010", title:"Which upstream factor model is compatible with downstream OU/HMM modelling?", type:"question", status:"open",
      body:"Options range from static PCA (Avellaneda-Lee), rolling-window PCA, regime-specific PCA, Kalman-filter betas (Adrian-Franzoni), to characteristic-instrumented betas (IPCA). Each makes different assumptions about how loadings evolve. The choice affects whether residuals within an HMM regime are validly OU and whether the IO state fires on genuine cointegration breakdown or on factor model misspecification.", documents:[] },
    { id:"C012", title:"Are factor loadings approximately constant within an HMM regime?", type:"question", status:"open",
      body:"If factor loadings drift continuously within a regime (as DCB and Del Negro-Otrok show they do), the OU residuals accumulate systematic factor-loading error over the regime duration. Is within-regime loading drift small enough to ignore relative to the idiosyncratic OU signal?", documents:[] },
    { id:"C013", title:"Does PCA defactoring preserve the cointegration relationship between the two legs?", type:"question", status:"open",
      body:"If (r_a, r_b) are cointegrated, are (eps_a, eps_b) also cointegrated where eps_i = r_i - beta_i' F? If defactoring destroys the cointegrating relationship, the spread from the residuals is not a valid cointegration spread and the OU assumption may not hold.", documents:[] }
  ],
  edges: [
    { id:"E001", from:"C002", to:"C001", type:"depends_on",
      rationale:"To come up with some theoretical emulation of the process, we first need to know what the problem looks like in practice", documents:[] },
    { id:"E002", from:"C003", to:"C002", type:"depends_on",
      rationale:"What the problem looks like depends in first instance on how we define regime switching models in this setting.", documents:[] },
    { id:"E003", from:"C005", to:"C004", type:"motivates",
      rationale:"Open design question", documents:[] },
    { id:"E004", from:"C006", to:"C004", type:"motivates",
      rationale:"Stationarity according to cointegration test could be insufficient for the pipeline idea.", documents:[] },
    { id:"E005", from:"C007", to:"C004", type:"motivates",
      rationale:"suggestion for ML -> interpretable", documents:[] },
    { id:"E006", from:"C004", to:"C008", type:"supports",
      rationale:"Avellaneda-Lee separates stock returns into systematic + residual component. The residual is treated as OU-like. The thesis adds gated online learning on top of this base.", documents:[] },
    { id:"E007", from:"C009", to:"C008", type:"motivates",
      rationale:"C008 proposes using AL residuals for gated learning, but this only works if static factor loadings produce valid OU residuals. If time-varying loadings contaminate the residuals, the gating signal is built on a misspecified base.", documents:[] },
    { id:"E008", from:"C010", to:"C008", type:"motivates",
      rationale:"The claim in C008 requires specifying which factor model sits upstream. The choice of static vs. adaptive vs. regime-specific loadings directly determines whether the OU adequacy criterion and the gating signal are trustworthy.", documents:[] },
    { id:"E010", from:"C012", to:"C008", type:"motivates",
      rationale:"If factor loadings drift within an HMM regime, the OU residual used for gated learning accumulates loading-estimation error throughout the regime.", documents:[] },
    { id:"E011", from:"C013", to:"C008", type:"depends_on",
      rationale:"The entire C008 architecture assumes that PCA-defactored residuals are cointegrated and OU-like. If defactoring destroys the cointegration relationship, the gated learning framework has no foundation.", documents:[] }
  ]
};

// ── State ─────────────────────────────────────────────────────────────────────

let G            = { nodes:[], edges:[] };
let pos          = {};   // { nodeId: {x, y} }
let sel          = null; // { type:'node'|'edge', id }
let dragged      = false;
let clipboard    = null; // copied node
let currentGraph  = 'main';
let multiSel      = new Set(); // node ids selected (ctrl+click) for folding into one node
let consolidations = []; // audit/index of fold and extract operations, see consolidations.json
let cvMarqueeRect  = null; // {x,y,w,h} canvas-local rect while drag-selecting, else null

// ── Storage ───────────────────────────────────────────────────────────────────
// Each "graph" is a separate named thread/tab of reasoning. When served over HTTP it
// lives at graphs/<name>.json on disk; offline (file://) it lives in localStorage only.

const SCHEMA_VERSION = '0.1.0';

// The on-disk/exported shape of a graph: schema_version + nodes + edges + pos, all in one
// file, so layout is part of the reproducible reasoning object rather than living only in
// browser localStorage.
function packGraph() {
  return { schema_version: SCHEMA_VERSION, nodes: G.nodes, edges: G.edges, pos };
}
function unpackGraph(data) {
  G   = { nodes: data.nodes || [], edges: data.edges || [] };
  pos = data.pos || {};
}

function save() {
  localStorage.setItem(`cg_g_${currentGraph}`, JSON.stringify(G));
  localStorage.setItem(`cg_p_${currentGraph}`, JSON.stringify(pos));
  saveToDisk();
}

let _diskTimer = null;
function saveToDisk() {
  clearTimeout(_diskTimer);
  _diskTimer = setTimeout(() => {
    if (window.location.protocol === 'file:') return;
    fetch(`/save?graph=${encodeURIComponent(currentGraph)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(packGraph(), null, 2)
    }).catch(() => {});
  }, 400);
}

function loadStorage() {
  const g = localStorage.getItem(`cg_g_${currentGraph}`);
  if (!g) return false;
  G   = JSON.parse(g);
  pos = JSON.parse(localStorage.getItem(`cg_p_${currentGraph}`) || '{}');
  ensurePos();
  return true;
}

function knownGraphs() {
  return JSON.parse(localStorage.getItem('cg_graphs') || '["main"]');
}
function rememberGraph(name) {
  const list = knownGraphs();
  if (!list.includes(name)) { list.push(name); localStorage.setItem('cg_graphs', JSON.stringify(list)); }
}

function renderGraphSel(names) {
  const sel = document.getElementById('graphSel');
  sel.innerHTML = names.map(n =>
    `<option value="${escA(n)}"${n===currentGraph?' selected':''}>${esc(n)}</option>`).join('');
}

async function loadGraph(name) {
  currentGraph = name;
  localStorage.setItem('cg_current_graph', name);
  rememberGraph(name);
  multiSel.clear(); sel = null; closeEdit();

  if (window.location.protocol !== 'file:') {
    try {
      const res = await fetch(`./graphs/${encodeURIComponent(name)}.json`);
      if (res.ok) {
        const data = await res.json();
        unpackGraph(data);
        if (!data.pos) {
          // Legacy file predating schema_version/pos: fall back to whatever layout we have.
          const p = localStorage.getItem(`cg_p_${name}`);
          pos = p ? JSON.parse(p) : {};
        }
        ensurePos();
      } else {
        loadStorage() || (G = name==='main' ? JSON.parse(JSON.stringify(DEFAULT)) : {nodes:[],edges:[]});
        initPos();
      }
    } catch {
      loadStorage() || (G = name==='main' ? JSON.parse(JSON.stringify(DEFAULT)) : {nodes:[],edges:[]});
      initPos();
    }
  } else {
    if (!loadStorage()) {
      G = name==='main' ? JSON.parse(JSON.stringify(DEFAULT)) : {nodes:[],edges:[]};
      initPos();
      save();
    }
  }

  const warnings = validateGraph(G);
  if (warnings.length) console.warn(`ClaimGraph: ${warnings.length} issue(s) in "${name}" — click Validate to see them.`, warnings);
}

async function switchGraph(name) {
  await loadGraph(name);
  render();
}

async function newGraph() {
  const raw = prompt('New graph name (letters, numbers, _ and - only):');
  if (!raw) return;
  const name = raw.trim().replace(/[^A-Za-z0-9_-]/g, '');
  if (!name) { alert('Invalid name'); return; }
  const names = window.location.protocol !== 'file:' ? await fetchGraphList() : knownGraphs();
  if (names.includes(name)) { alert('A graph with that name already exists'); switchGraph(name); return; }
  currentGraph = name;
  G = { nodes:[], edges:[] };
  pos = {};
  rememberGraph(name);
  save();
  renderGraphSel([...names, name]);
  render();
}

async function fetchGraphList() {
  try {
    const res = await fetch('/graphs');
    if (res.ok) return await res.json();
  } catch {}
  return knownGraphs();
}

// Save an arbitrary named graph (used when extracting nodes into a brand new graph file)
// without disturbing the currently open graph/currentGraph.
async function saveGraphNamed(name, data) {
  if (window.location.protocol !== 'file:') {
    await fetch(`/save?graph=${encodeURIComponent(name)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data, null, 2)
    }).catch(() => {});
  } else {
    localStorage.setItem(`cg_g_${name}`, JSON.stringify({ nodes: data.nodes, edges: data.edges }));
    localStorage.setItem(`cg_p_${name}`, JSON.stringify(data.pos || {}));
  }
  rememberGraph(name);
}

// ── Consolidations ───────────────────────────────────────────────────────────
// consolidations.json is a single, project-wide audit/index of fold and extract
// operations. It is not the source of structural truth — the graph files are —
// but it's what makes "where did this summary node come from" reconstructable.

async function loadConsolidations() {
  if (window.location.protocol !== 'file:') {
    try {
      const res = await fetch('/consolidations');
      if (res.ok) return await res.json();
    } catch {}
  }
  return JSON.parse(localStorage.getItem('cg_consolidations') || '[]');
}

function saveConsolidations() {
  localStorage.setItem('cg_consolidations', JSON.stringify(consolidations));
  if (window.location.protocol === 'file:') return;
  fetch('/consolidations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(consolidations, null, 2)
  }).catch(() => {});
}

function nextConsolidationId() {
  const max = consolidations.reduce((m,c) => Math.max(m, parseInt((c.id||'').replace(/\D/g,''))||0), 0);
  return 'CS' + String(max + 1).padStart(3, '0');
}

function recordConsolidation(rec) {
  consolidations.push(rec);
  saveConsolidations();
  return rec.id;
}

// ── Taskboard ─────────────────────────────────────────────────────────────────
// taskboard.md is how ClaimGraph hands work to an AI agent without calling one itself:
// "Consolidate via agent" appends a task here instead of writing the summary directly.

async function loadTaskboard() {
  if (window.location.protocol !== 'file:') {
    try {
      const res = await fetch('/taskboard');
      if (res.ok) return await res.text();
    } catch {}
  }
  return localStorage.getItem('cg_taskboard')
    || '# ClaimGraph Taskboard\n\nTasks for an AI agent to pick up. See README "Consolidate via agent".\n';
}

async function saveTaskboard(text) {
  localStorage.setItem('cg_taskboard', text);
  if (window.location.protocol === 'file:') return;
  await fetch('/taskboard', {
    method: 'POST',
    headers: { 'Content-Type': 'text/markdown' },
    body: text
  }).catch(() => {});
}

async function appendTaskboardEntry({ consId, graph, summaryNodeId, sourceIds }) {
  const block = `
## Task ${consId} — Consolidate nodes in graph "${graph}"

- Status: pending
- Consolidation ID: ${consId}
- Graph: ${graph}
- Summary node: ${summaryNodeId}
- Source nodes: ${sourceIds.join(', ')}

### Instructions

`;
  const current = await loadTaskboard();

function initPos() {
  const cv = document.getElementById('cv');
  const W  = cv.clientWidth  || 820;
  const H  = cv.clientHeight || 480;
  const r  = Math.min(W, H) * 0.33;
  G.nodes.forEach((n, i) => {
    if (pos[n.id]) return;
    const a = (i / Math.max(G.nodes.length, 1)) * 2 * Math.PI - Math.PI / 2;
    pos[n.id] = { x: W/2 + r * Math.cos(a), y: H/2 + r * Math.sin(a) };
  });
}

function ensurePos() {
  G.nodes.forEach(n => {
    if (!pos[n.id]) pos[n.id] = { x: 200 + Math.random()*400, y:150 + Math.random()*280 };
  });
}

// ── IDs ───────────────────────────────────────────────────────────────────────

function nextId(prefix, arr) {
  // Scan folded-away children too, so a restored node can never collide with a freshly minted id.
  let max = 0;
  const visit = list => list.forEach(x => {
    max = Math.max(max, parseInt(x.id.replace(/\D/g,''))||0);
    if (x.children) { visit(x.children.nodes||[]); visit(x.children.edges||[]); visit(x.children.boundaryEdges||[]); }
  });
  visit(arr);
  return prefix + String(max + 1).padStart(3, '0');
}

function renderSVG() {

    const clr  = NCLR[n.type] || '#888';
    const isSel = sel && sel.type==='node' && sel.id===n.id;
    const isMulti = multiSel.has(n.id);
    const lbl  = n.title.length > 19 ? n.title.slice(0,19)+'…' : n.title;
    const lone = !G.edges.some(e => e.from===n.id || e.to===n.id);
    const strokeClr = isSel ? '#fff' : isMulti ? '#fbbf24' : 'none';
    const strokeW   = isSel || isMulti ? 2.5 : 0;
    return `<g style="cursor:pointer"
               transform="translate(${p.x-NW/2},${p.y-NH/2})"
               onmousedown="event.stopPropagation();nmd(event,'${n.id}')"
               onclick="event.stopPropagation()">
      <rect width="${NW}" height="${NH}" rx="7"
            fill="${clr}" opacity="${isSel?1:0.87}"

      <circle cx="7" cy="7" r="3.5" fill="${SCLR[n.status]||SCLR.open}" stroke="rgba(0,0,0,0.25)" stroke-width="0.5"/>
      ${n.collapsed&&n.children?`<text x="6" y="${NH-5}" fill="rgba(255,255,255,0.9)" font-size="9" font-family="inherit" style="pointer-events:none">⊕ ${n.children.nodes.length}</text>`:``}

      ${n.consolidation_id?`<circle cx="${NW-9}" cy="${NH-9}" r="7" fill="#fff" stroke="#ccc" stroke-width="1"/><text x="${NW-9}" y="${NH-6}" text-anchor="middle" font-size="7" font-weight="700" fill="#333" font-family="inherit" style="pointer-events:none">${esc((n.consolidation_id||'').replace(/\D/g,''))}</text>`:``}

// Rectangle boundary point (traveling from cx,cy toward tx,ty)
function bpt(cx, cy, tx, ty) {
  const dx = tx-cx, dy = ty-cy;
  const d  = Math.sqrt(dx*dx+dy*dy) || 1;
  const nx = dx/d, ny = dy/d;
  const t  = Math.min(
    nx ? (NW/2)/Math.abs(nx) : 1e9,
    ny ? (NH/2)/Math.abs(ny) : 1e9
  );
  return { x: cx+nx*t, y: cy+ny*t };
}

  const o = ownerArr(kind).find(x=>x.id===ownerId); if(!o) return;
  pushUndo();
  if (!o.documents) o.documents = [];
  o.documents.push({ level:'admin', reference:'', summary:'' });

  kind==='node' ? editNode(ownerId) : editEdge(ownerId);

// ── Fold / Expand (consolidate a chain into one node) ───────────────────────────
// Folding replaces a ctrl+click-selected set of nodes (and the edges between them)
// with a single node whose `body` is a hand-written summary. The originals are kept
// verbatim under `children` so the chain can be restored. This is what keeps long,
// settled chains cheap for an AI to revisit: by default it only reads the summary.

function toggleMultiSel(id) {
  if (multiSel.has(id)) multiSel.delete(id); else multiSel.add(id);
  renderSVG(); renderFoldBar();
}

function clearMultiSel() {
  multiSel.clear();
  renderSVG(); renderFoldBar();
}

function renderFoldBar() {
  const bar = document.getElementById('foldbar');
  if (multiSel.size >= 2) {
    bar.style.display = 'flex';
    document.getElementById('foldcount').textContent = `${multiSel.size} nodes selected`;
  } else {
    bar.style.display = 'none';
  }
}

function foldSelected() {
  const ids = [...multiSel];
  if (ids.length < 2) return;
  pushUndo();

  const idSet         = new Set(ids);
  const childNodes     = G.nodes.filter(n => idSet.has(n.id));
  const childEdges     = [];
  const boundaryEdges  = [];
  G.edges.forEach(e => {
    const fIn = idSet.has(e.from), tIn = idSet.has(e.to);
    if (fIn && tIn) childEdges.push(JSON.parse(JSON.stringify(e)));
    else if (fIn || tIn) boundaryEdges.push(JSON.parse(JSON.stringify(e)));
  });
  const childPos = {};
  ids.forEach(id => { if (pos[id]) childPos[id] = pos[id]; });
  const cx = ids.reduce((s,id) => s + (pos[id]?pos[id].x:0), 0) / ids.length;
  const cy = ids.reduce((s,id) => s + (pos[id]?pos[id].y:0), 0) / ids.length;

  // Drop fully-internal edges, then remap remaining (boundary) edges onto the new node.
  G.edges = G.edges.filter(e => !childEdges.some(c => c.id === e.id));
  G.edges.forEach(e => {
    if (idSet.has(e.from)) e.from = '__NEW__';
    if (idSet.has(e.to))   e.to   = '__NEW__';
  });
  G.nodes = G.nodes.filter(n => !idSet.has(n.id));
  ids.forEach(id => delete pos[id]);

  const newId = nextId('C', G.nodes);
  G.edges.forEach(e => {
    if (e.from === '__NEW__') e.from = newId;
    if (e.to   === '__NEW__') e.to   = newId;
  });

  const consId = nextConsolidationId();
  const label  = `Folded chain (${ids.length} nodes)`;

  G.nodes.push({
    id: newId, title: label, type: 'claim', status: 'settled',
    body: '', documents: [],
    collapsed: true,
    consolidation_id: consId,
    children: { nodes: childNodes, edges: childEdges, boundaryEdges, pos: childPos }
  });
  pos[newId] = { x: cx || 300, y: cy || 300 };

  recordConsolidation({
    id: consId,
    created_at: new Date().toISOString(),
    mode: 'fold_in_place',
    source_graph: currentGraph,
    target_graph: currentGraph,
    source_node_ids: ids,
    source_edge_ids: childEdges.map(e => e.id),
    summary_node_id: newId,
    target_start_node_id: null,
    label,
    status: 'active'
  });

  multiSel.clear();
  sel = { type:'node', id:newId };
  save(); render(); renderFoldBar(); editNode(newId);
}

function expandNode(id) {
  const n = G.nodes.find(x => x.id === id);
  if (!n || !n.collapsed || !n.children) return;
  pushUndo();

  const { nodes, edges, boundaryEdges, pos: childPos } = n.children;
  G.nodes = G.nodes.filter(x => x.id !== id);
  G.nodes.push(...nodes);
  G.edges.push(...edges);
  boundaryEdges.forEach(orig => {
    const live = G.edges.find(e => e.id === orig.id);
    if (live) { live.from = orig.from; live.to = orig.to; }
  });
  delete pos[id];
  Object.assign(pos, childPos);

  if (n.consolidation_id) {
    const rec = consolidations.find(c => c.id === n.consolidation_id);
    if (rec) { rec.status = 'expanded'; saveConsolidations(); }
  }

  sel = null; closeEdit(); save(); render();
}

// Fold the selected nodes the same way foldSelected does, but instead of asking the user to
// write the summary, queue the work for an AI agent via taskboard.md. ClaimGraph never calls
// an agent itself — it writes a task, and leaves the node's body as a visible placeholder
// until something (a human, or an agent reading taskboard.md) replaces it.
async function consolidateViaAgent() {
  const ids = [...multiSel];
  if (ids.length < 2) return;
  pushUndo();

  const idSet         = new Set(ids);
  const childNodes     = G.nodes.filter(n => idSet.has(n.id));
  const childEdges     = [];
  const boundaryEdges  = [];
  G.edges.forEach(e => {
    const fIn = idSet.has(e.from), tIn = idSet.has(e.to);
    if (fIn && tIn) childEdges.push(JSON.parse(JSON.stringify(e)));
    else if (fIn || tIn) boundaryEdges.push(JSON.parse(JSON.stringify(e)));
  });
  const childPos = {};
  ids.forEach(id => { if (pos[id]) childPos[id] = pos[id]; });
  const cx = ids.reduce((s,id) => s + (pos[id]?pos[id].x:0), 0) / ids.length;
  const cy = ids.reduce((s,id) => s + (pos[id]?pos[id].y:0), 0) / ids.length;

  G.edges = G.edges.filter(e => !childEdges.some(c => c.id === e.id));
  G.edges.forEach(e => {
    if (idSet.has(e.from)) e.from = '__NEW__';
    if (idSet.has(e.to))   e.to   = '__NEW__';
  });
  G.nodes = G.nodes.filter(n => !idSet.has(n.id));
  ids.forEach(id => delete pos[id]);

  const newId = nextId('C', G.nodes);
  G.edges.forEach(e => {
    if (e.from === '__NEW__') e.from = newId;
    if (e.to   === '__NEW__') e.to   = newId;
  });

  const consId = nextConsolidationId();
  const label  = `Consolidation task (${ids.length} nodes)`;

  G.nodes.push({
    id: newId, title: label, type: 'claim', status: 'needs_test',
    body: '[CONSOLIDATION TASKED]', documents: [],
    collapsed: true,
    consolidation_id: consId,
    children: { nodes: childNodes, edges: childEdges, boundaryEdges, pos: childPos }
  });
  pos[newId] = { x: cx || 300, y: cy || 300 };

  recordConsolidation({
    id: consId,
    created_at: new Date().toISOString(),
    mode: 'fold_in_place',
    source_graph: currentGraph,
    target_graph: currentGraph,
    source_node_ids: ids,
    source_edge_ids: childEdges.map(e => e.id),
    summary_node_id: newId,
    target_start_node_id: null,
    label,
    status: 'tasked'
  });

  await appendTaskboardEntry({ consId, graph: currentGraph, summaryNodeId: newId, sourceIds: ids });

  multiSel.clear();
  sel = { type:'node', id:newId };
  save(); render(); renderFoldBar(); editNode(newId);
}

// Move the selected nodes (and the edges between them) into a brand new graph file,
// leaving a portal node behind in the current graph. Unlike foldSelected, the original
// nodes/edges are NOT kept inline anywhere in the current graph — they live in the new
// graph file, and the consolidation record + portal node's target_graph are what make
// that relationship reconstructable later.
async function extractSelected() {
  const ids = [...multiSel];
  if (ids.length < 2) return;

  const rawName = prompt('New graph name for the extracted nodes (letters, numbers, _ and - only):');
  if (!rawName) return;
  const name = rawName.trim().replace(/[^A-Za-z0-9_-]/g, '');
  if (!name) { alert('Invalid name'); return; }

  const existing = window.location.protocol !== 'file:' ? await fetchGraphList() : knownGraphs();
  if (existing.includes(name)) { alert('A graph with that name already exists'); return; }

  const label = prompt('Summary label for the portal node left behind:', `Extracted: ${name}`);
  if (label === null) return;

  pushUndo();

  const idSet         = new Set(ids);
  const extractedNodes = G.nodes.filter(n => idSet.has(n.id)).map(n => JSON.parse(JSON.stringify(n)));
  const internalEdges  = [];
  const boundaryEdges  = [];
  G.edges.forEach(e => {
    const fIn = idSet.has(e.from), tIn = idSet.has(e.to);
    if (fIn && tIn) internalEdges.push(JSON.parse(JSON.stringify(e)));
    else if (fIn || tIn) boundaryEdges.push(JSON.parse(JSON.stringify(e)));
  });
  const extractedPos = {};
  ids.forEach(id => { if (pos[id]) extractedPos[id] = pos[id]; });
  const cx = ids.reduce((s,id) => s + (pos[id]?pos[id].x:0), 0) / ids.length;
  const cy = ids.reduce((s,id) => s + (pos[id]?pos[id].y:0), 0) / ids.length;

  await saveGraphNamed(name, {
    schema_version: SCHEMA_VERSION, nodes: extractedNodes, edges: internalEdges, pos: extractedPos
  });

  // Drop the internal edges/nodes from the current graph, remap boundary edges onto the portal node.
  G.edges = G.edges.filter(e => !internalEdges.some(c => c.id === e.id));
  G.edges.forEach(e => {
    if (idSet.has(e.from)) e.from = '__NEW__';
    if (idSet.has(e.to))   e.to   = '__NEW__';
  });
  G.nodes = G.nodes.filter(n => !idSet.has(n.id));
  ids.forEach(id => delete pos[id]);

  const portalId = nextId('C', G.nodes);
  G.edges.forEach(e => {
    if (e.from === '__NEW__') e.from = portalId;
    if (e.to   === '__NEW__') e.to   = portalId;
  });

  const consId = nextConsolidationId();
  const portalLabel = label || `Extracted: ${name}`;

  G.nodes.push({
    id: portalId, title: portalLabel, type: 'claim', status: 'active',
    body: '', documents: [],
    collapsed: true, portal: true,
    consolidation_id: consId,
    target_graph: name
  });
  pos[portalId] = { x: cx || 300, y: cy || 300 };

  recordConsolidation({
    id: consId,
    created_at: new Date().toISOString(),
    mode: 'extract_to_new_graph',
    source_graph: currentGraph,
    target_graph: name,
    source_node_ids: ids,
    source_edge_ids: internalEdges.map(e => e.id),
    summary_node_id: portalId,
    target_start_node_id: ids[0],
    label: portalLabel,
    status: 'active'
  });

  multiSel.clear();
  sel = { type:'node', id:portalId };
  save(); render(); renderFoldBar(); editNode(portalId);
}

function clearAll() {
  if (!confirm('Clear entire graph?')) return;
  G={nodes:[],edges:[]}; pos={}; sel=null; multiSel.clear(); closeEdit(); save(); render();
}

// ── Validation ────────────────────────────────────────────────────────────────
// Non-blocking: returns a list of warning strings rather than rejecting the graph.
// Catches the things that make a graph ambiguous or unreadable for an agent traversing it.

function validateGraph(g) {
  const warnings = [];
  const nodeIds  = new Set(g.nodes.map(n => n.id));

  g.nodes.forEach(n => {
    if (!NODE_TYPES.includes(n.type)) warnings.push(`Node ${n.id}: unknown type "${n.type}"`);
    if (n.status && !STATUS.includes(n.status)) warnings.push(`Node ${n.id}: unknown status "${n.status}"`);
    if (n.consolidation_id && !consolidations.some(c => c.id === n.consolidation_id)) {
      warnings.push(`Node ${n.id}: consolidation_id "${n.consolidation_id}" not found in consolidations.json`);
    }
    (n.documents||[]).forEach((d,i) => {
      if (d.level === 'summary' && !d.summary) warnings.push(`Node ${n.id}: document #${i+1} is level "summary" but has no summary path`);
      if (d.level === 'full' && !d.reference) warnings.push(`Node ${n.id}: document #${i+1} is level "full" but has no reference path`);
    });
  });

  g.edges.forEach(e => {
    if (!EDGE_TYPES.includes(e.type)) warnings.push(`Edge ${e.id}: unknown type "${e.type}"`);
    if (!nodeIds.has(e.from)) warnings.push(`Edge ${e.id}: "from" node ${e.from} does not exist`);
    if (!nodeIds.has(e.to))   warnings.push(`Edge ${e.id}: "to" node ${e.to} does not exist`);
    (e.documents||[]).forEach((d,i) => {
      if (d.level === 'summary' && !d.summary) warnings.push(`Edge ${e.id}: document #${i+1} is level "summary" but has no summary path`);
      if (d.level === 'full' && !d.reference) warnings.push(`Edge ${e.id}: document #${i+1} is level "full" but has no reference path`);
    });
  });

  return warnings;
}

function runValidation(silentIfClean) {
  const warnings = validateGraph(G);
  if (warnings.length) alert(`${warnings.length} issue(s) found:\n\n` + warnings.join('\n'));
  else if (!silentIfClean) alert('No issues found.');
  return warnings;
}

// ── Import / Export ───────────────────────────────────────────────────────────

function exportJSON() {
  const blob = new Blob([JSON.stringify(packGraph(), null, 2)], {type:'application/json'});
  Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download:`${currentGraph}.json`
  }).click();
}

function trigImport() { document.getElementById('fi').click(); }

function onImport(ev) {
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.nodes||!d.edges) throw new Error('Expected {nodes, edges}');
      unpackGraph(d);
      if (!d.pos) initPos(); else ensurePos();
      sel=null; multiSel.clear(); closeEdit(); save(); render();
      runValidation(true);
    } catch(err) { alert('Import error: ' + err.message); }
  };
  r.readAsText(f);
  ev.target.value='';
}

// ── Drag ─────────────────────────────────────────────────────────────────────

function nmd(e, id) {
  if (e.button!==0) return;
  e.preventDefault();

  if (e.ctrlKey || e.metaKey) {
    toggleMultiSel(id);
    return;
  }

  // Select on press
  sel={type:'node',id}; render(); editNode(id);

  const cv  = document.getElementById('cv');
  const r0  = cv.getBoundingClientRect();
  const ox  = e.clientX - r0.left - pos[id].x;
  const oy  = e.clientY - r0.top  - pos[id].y;
  const sx  = e.clientX, sy = e.clientY;

  function mm(ev) {
    if (Math.abs(ev.clientX-sx)>3||Math.abs(ev.clientY-sy)>3) dragged=true;
    const r = cv.getBoundingClientRect();
    pos[id] = { x: ev.clientX-r.left-ox, y: ev.clientY-r.top-oy };
    renderSVG();
  }
  function mu() {
    if (dragged) save();
    document.removeEventListener('mousemove', mm);
    document.removeEventListener('mouseup',   mu);
  }
  document.addEventListener('mousemove', mm);
  document.addEventListener('mouseup',   mu);
}

// Windows-style click-and-drag rectangle select on empty canvas. Only fires for presses that
// start on empty canvas — nodes and edges stopPropagation on their own mousedown, so dragging
// a node still moves it (above) rather than starting a marquee. Ctrl/Cmd/Shift held at release
// adds to the existing selection instead of replacing it; plain ctrl+click on a single node
// (toggleMultiSel, above) keeps working independently of this.
function cvMarqueeMouseDown(e) {
  if (e.button !== 0) return;
  const cv = document.getElementById('cv');
  const r0 = cv.getBoundingClientRect();
  const startX = e.clientX - r0.left, startY = e.clientY - r0.top;
  let started = false, rectEl = null;

  function mm(ev) {
    const x = ev.clientX - r0.left, y = ev.clientY - r0.top;
    if (!started && (Math.abs(x-startX) > 3 || Math.abs(y-startY) > 3)) {
      started = true;
      rectEl = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rectEl.setAttribute('fill', 'rgba(59,130,246,0.12)');
      rectEl.setAttribute('stroke', '#3b82f6');
      rectEl.setAttribute('stroke-width', '1');
      rectEl.setAttribute('stroke-dasharray', '4 3');
      cv.appendChild(rectEl);
    }
    if (started) {
      const rx = Math.min(startX, x), ry = Math.min(startY, y);
      const rw = Math.abs(x - startX), rh = Math.abs(y - startY);
      rectEl.setAttribute('x', rx); rectEl.setAttribute('y', ry);
      rectEl.setAttribute('width', rw); rectEl.setAttribute('height', rh);
      cvMarqueeRect = { x: rx, y: ry, w: rw, h: rh };
    }
  }

  function mu(ev) {
    document.removeEventListener('mousemove', mm);
    document.removeEventListener('mouseup', mu);
    if (started && cvMarqueeRect) {
      const rect = cvMarqueeRect;
      const additive = ev.ctrlKey || ev.metaKey || ev.shiftKey;
      if (!additive) multiSel.clear();
      G.nodes.forEach(n => {
        const p = pos[n.id]; if (!p) return;
        const nx0 = p.x - NW/2, ny0 = p.y - NH/2, nx1 = p.x + NW/2, ny1 = p.y + NH/2;
        const overlaps = nx0 < rect.x+rect.w && nx1 > rect.x && ny0 < rect.y+rect.h && ny1 > rect.y;
        if (overlaps) multiSel.add(n.id);
      });
      rectEl.remove();
      cvMarqueeRect = null;
      sel = null; closeEdit();
      renderSVG(); renderFoldBar();
    }
  }

  document.addEventListener('mousemove', mm);
  document.addEventListener('mouseup', mu);
}

// ── Undo ──────────────────────────────────────────────────────────────────────

const undoStack = [];
function pushUndo() {
  undoStack.push({ G: JSON.parse(JSON.stringify(G)), pos: JSON.parse(JSON.stringify(pos)) });
  if (undoStack.length > 50) undoStack.shift();
}
function undo() {
  const snap = undoStack.pop();
  if (!snap) return;
  G = snap.G; pos = snap.pos;
  sel = null; closeEdit(); save(); render();
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────

function initKeyboard() {
  document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

    if ((e.key === 'Delete' || e.key === 'Backspace') && !typing) {
      if (!sel) return;
      if (sel.type === 'node') delNode(sel.id);
      else delEdge(sel.id);
      e.preventDefault();
    }

    if (e.key === 'z' && (e.ctrlKey || e.metaKey) && !typing) {
      undo(); e.preventDefault();
    }

    if (e.key === 'c' && (e.ctrlKey || e.metaKey) && !typing) {
      if (!sel || sel.type !== 'node') return;
      clipboard = JSON.parse(JSON.stringify(G.nodes.find(n => n.id === sel.id)));
      e.preventDefault();
    }

    if (e.key === 'v' && (e.ctrlKey || e.metaKey) && !typing) {
      if (!clipboard) return;
      pushUndo();
      const id = nextId('C', G.nodes);
      G.nodes.push({ ...clipboard, id });
      const src = pos[clipboard.id] || { x: 400, y: 300 };
      pos[id] = { x: src.x + 40, y: src.y + 40 };
      sel = { type: 'node', id };
      save(); render(); editNode(id);
      e.preventDefault();
    }
  });
}

// ── Utils ─────────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escA(s) {
  return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  consolidations = await loadConsolidations();

  const names = window.location.protocol !== 'file:' ? await fetchGraphList() : knownGraphs();
  const list  = names.length ? names : ['main'];
  const start = localStorage.getItem('cg_current_graph') || list[0];

  await loadGraph(list.includes(start) ? start : list[0]);
  renderGraphSel(list.includes(currentGraph) ? list : [...list, currentGraph]);

  document.getElementById('nn-ty').innerHTML = typeOpts(NODE_TYPES, NODE_TYPES[0]);
  document.getElementById('ne-ty').innerHTML = typeOpts(EDGE_TYPES, EDGE_TYPES[0]);
  document.getElementById('cv').addEventListener('click', desel);
  document.getElementById('cv').addEventListener('mousedown', cvMarqueeMouseDown);
  initKeyboard();
  render();
}

init();
